<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0d0d0d;
            color: #fff;
            text-align: center;
        }

        h1 {
            min-width: 0px;
        }

        p {
            margin-bottom: 2rem;
            color: #a1a1aa;
        }

        a {
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 1px solid #333;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        a:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <h1>404 - Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/">Go Home</a>
    <script>
        // Single Page Apps often handle routing client-side.
        // If we're on a subpath, redirect to root preserving the path in a query param
        // so the SPA can pick it up (optional implementation detail for some hosts like GH Pages)
        // For Vercel/Netlify, the server rewrites handle this, so this page is a true 404 fallback.
    </script>
</body>

</html>
